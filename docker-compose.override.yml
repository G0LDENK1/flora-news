version: "3.8"

networks:
  traefik-net:
    external: true
    name: openclaw-rraq_default

services:
  traefik:
    profiles: ["disabled"]

  ghost:
    ports:
      - "2368:2368"
    networks:
      - flora-net
      - flora-internal
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=openclaw-rraq_default"
      - "traefik.http.routers.flora-ghost.rule=Host(`arcanixmedia.com`)"
      - "traefik.http.routers.flora-ghost.entrypoints=websecure"
      - "traefik.http.routers.flora-ghost.tls.certresolver=letsencrypt"
      - "traefik.http.services.flora-ghost.loadbalancer.server.port=2368"

  n8n:
    ports:
      - "5678:5678"
    networks:
      - flora-net
      - flora-internal
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=openclaw-rraq_default"
      - "traefik.http.routers.flora-n8n.rule=Host(`n8n.arcanixmedia.com`)"
      - "traefik.http.routers.flora-n8n.entrypoints=websecure"
      - "traefik.http.routers.flora-n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.flora-n8n.loadbalancer.server.port=5678"

  flora-admin:
    ports:
      - "3001:3001"
    networks:
      - flora-net
      - flora-internal
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=openclaw-rraq_default"
      - "traefik.http.routers.flora-admin-svc.rule=Host(`admin.arcanixmedia.com`)"
      - "traefik.http.routers.flora-admin-svc.entrypoints=websecure"
      - "traefik.http.routers.flora-admin-svc.tls.certresolver=letsencrypt"
      - "traefik.http.services.flora-admin-svc.loadbalancer.server.port=3001"

  grafana:
    ports:
      - "3000:3000"
    networks:
      - flora-net
      - flora-internal
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=openclaw-rraq_default"
      - "traefik.http.routers.flora-grafana.rule=Host(`grafana.arcanixmedia.com`)"
      - "traefik.http.routers.flora-grafana.entrypoints=websecure"
      - "traefik.http.routers.flora-grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.flora-grafana.loadbalancer.server.port=3000"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - flora-net
      - flora-internal
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=openclaw-rraq_default"
      - "traefik.http.routers.flora-minio.rule=Host(`minio.arcanixmedia.com`)"
      - "traefik.http.routers.flora-minio.entrypoints=websecure"
      - "traefik.http.routers.flora-minio.tls.certresolver=letsencrypt"
      - "traefik.http.services.flora-minio.loadbalancer.server.port=9001"

  watchtower:
    command: --interval 86400 --cleanup

version: '3.8'
x-common-env:
  TZ: America/New_York
x-restart:
  restart: unless-stopped
networks:
  flora-net:
    driver: bridge
  flora-internal:
    driver: bridge
    internal: true
volumes:
  postgres_data: null
  redis_data: null
  n8n_data: null
  qdrant_data: null
  minio_data: null
  ghost_data: null
  grafana_data: null
  prometheus_data: null
  traefik_certs: null
services:
  traefik:
    restart: unless-stopped
    image: traefik:v3.0
    ports:
    - 80:80
    - 443:443
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - traefik_certs:/certs
    - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
    - flora-net
    environment:
      TZ: America/New_York
  postgres:
    restart: unless-stopped
    image: postgres:15-alpine
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    - ./sql:/sql:ro
    networks:
    - flora-internal
    environment:
      TZ: America/New_York
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
    - redis_data:/data
    networks:
    - flora-internal
    environment:
      TZ: America/New_York
    healthcheck:
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
  n8n:
    restart: unless-stopped
    image: n8nio/n8n:latest
    volumes:
    - n8n_data:/home/node/.n8n
    - ./docker/n8n/workflows:/workflows:ro
    - ./prompts:/prompts:ro
    networks:
    - flora-net
    - flora-internal
    environment:
      TZ: America/New_York
      N8N_BASIC_AUTH_ACTIVE: 'true'
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT}
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      QUEUE_BULL_REDIS_HOST: ${REDIS_HOST}
      QUEUE_BULL_REDIS_PORT: ${REDIS_PORT}
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      EXECUTIONS_MODE: queue
      GENERIC_TIMEZONE: America/New_York
      N8N_LOG_LEVEL: info
      N8N_METRICS: 'true'
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BEEHIIV_API_KEY: ${BEEHIIV_API_KEY}
      BEEHIIV_PUBLICATION_ID: ${BEEHIIV_PUBLICATION_ID}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:latest
    volumes:
    - qdrant_data:/qdrant/storage
    networks:
    - flora-internal
    environment:
      TZ: America/New_York
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    volumes:
    - minio_data:/data
    networks:
    - flora-net
    - flora-internal
    environment:
      TZ: America/New_York
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
  ghost:
    restart: unless-stopped
    image: ghost:5-alpine
    volumes:
    - ghost_data:/var/lib/ghost/content
    networks:
    - flora-net
    - flora-internal
    environment:
      TZ: America/New_York
      url: ${GHOST_URL}
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: ${GHOST_DB_USER}
      database__connection__password: ${GHOST_DB_PASSWORD}
      database__connection__database: ${GHOST_DB_NAME}
      mail__transport: ${GHOST_MAIL_TRANSPORT}
      mail__options__host: ${GHOST_MAIL_HOST}
      mail__options__port: ${GHOST_MAIL_PORT}
      mail__options__auth__user: ${GHOST_MAIL_USER}
      mail__options__auth__pass: ${GHOST_MAIL_PASS}
      mail__from: ${GHOST_MAIL_FROM}
      NODE_ENV: production
    depends_on:
    - ghost-db
  ghost-db:
    restart: unless-stopped
    image: mysql:8.0
    volumes:
    - ./docker/ghost/ghost-db:/var/lib/mysql
    networks:
    - flora-internal
    environment:
      TZ: America/New_York
      MYSQL_ROOT_PASSWORD: ${GHOST_DB_PASSWORD}root
      MYSQL_DATABASE: ${GHOST_DB_NAME}
      MYSQL_USER: ${GHOST_DB_USER}
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD}
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:latest
    volumes:
    - prometheus_data:/prometheus
    - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
    - flora-internal
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=30d
    - --web.enable-lifecycle
  grafana:
    restart: unless-stopped
    image: grafana/grafana:latest
    volumes:
    - grafana_data:/var/lib/grafana
    - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
    - flora-net
    - flora-internal
    environment:
      TZ: America/New_York
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: grafana.${DOMAIN}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
    depends_on:
    - prometheus
  watchtower:
    restart: unless-stopped
    image: containrrr/watchtower:latest
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    networks:
    - flora-internal
    environment:
      TZ: America/New_York
      WATCHTOWER_CLEANUP: 'true'
      WATCHTOWER_SCHEDULE: 0 0 4 * * *
      WATCHTOWER_NOTIFICATIONS: email
      WATCHTOWER_NOTIFICATION_EMAIL_TO: ${WATCHTOWER_NOTIFICATION_EMAIL}
      WATCHTOWER_POLL_INTERVAL: 86400
    command: --interval 86400 --cleanup
  flora-admin:
    restart: unless-stopped
    build:
      context: ./admin
      dockerfile: Dockerfile
    networks:
    - flora-net
    - flora-internal
    environment:
      TZ: America/New_York
      NODE_ENV: production
      PORT: 3001
      ADMIN_SECRET: ${ADMIN_SECRET}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

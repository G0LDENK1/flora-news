version: "3.8"

# =============================================================================
# flora-news — Full Stack Docker Compose
# =============================================================================

x-common-env: &common-env
  TZ: America/New_York

x-restart: &restart
  restart: unless-stopped

networks:
  flora-net:
    driver: bridge
  flora-internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  qdrant_data:
  minio_data:
  ghost_data:
  grafana_data:
  prometheus_data:
  traefik_certs:

services:

  # ===========================================================================
  # TRAEFIK — Reverse Proxy + TLS
  # ===========================================================================
  traefik:
    image: traefik:v3.0
    <<: *restart
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/certs
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - flora-net
    environment:
      <<: *common-env
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=auth@file"

  # ===========================================================================
  # POSTGRES — Primary Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    <<: *restart
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql:/sql:ro
    networks:
      - flora-internal
    environment:
      <<: *common-env
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # REDIS — Cache + Queue
  # ===========================================================================
  redis:
    image: redis:7-alpine
    <<: *restart
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - flora-internal
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # N8N — Workflow Automation
  # ===========================================================================
  n8n:
    image: n8nio/n8n:latest
    <<: *restart
    volumes:
      - n8n_data:/home/node/.n8n
      - ./docker/n8n/workflows:/workflows:ro
      - ./prompts:/prompts:ro
    networks:
      - flora-net
      - flora-internal
    environment:
      <<: *common-env
      # Auth
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # URLs
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL}
      # Database
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT}
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Queue
      QUEUE_BULL_REDIS_HOST: ${REDIS_HOST}
      QUEUE_BULL_REDIS_PORT: ${REDIS_PORT}
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
      EXECUTIONS_MODE: queue
      # Generic
      GENERIC_TIMEZONE: America/New_York
      N8N_LOG_LEVEL: info
      N8N_METRICS: "true"
      # External secrets (make env vars available as n8n credentials)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BEEHIIV_API_KEY: ${BEEHIIV_API_KEY}
      BEEHIIV_PUBLICATION_ID: ${BEEHIIV_PUBLICATION_ID}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  # ===========================================================================
  # QDRANT — Vector Database (Knowledge Base)
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    <<: *restart
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - flora-internal
    environment:
      <<: *common-env
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

  # ===========================================================================
  # MINIO — Object Storage (Attachments, Images)
  # ===========================================================================
  minio:
    image: minio/minio:latest
    <<: *restart
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - flora-net
      - flora-internal
    environment:
      <<: *common-env
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    labels:
      - "traefik.enable=true"
      # API
      - "traefik.http.routers.minio-api.rule=Host(`minio.${DOMAIN}`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api.service=minio-api"
      - "traefik.http.services.minio-api.loadbalancer.server.port=9000"
      # Console
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.${DOMAIN}`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  # ===========================================================================
  # GHOST — Website + CMS
  # ===========================================================================
  ghost:
    image: ghost:5-alpine
    <<: *restart
    volumes:
      - ghost_data:/var/lib/ghost/content
    networks:
      - flora-net
      - flora-internal
    environment:
      <<: *common-env
      url: ${GHOST_URL}
      database__client: mysql
      database__connection__host: ghost-db
      database__connection__user: ${GHOST_DB_USER}
      database__connection__password: ${GHOST_DB_PASSWORD}
      database__connection__database: ${GHOST_DB_NAME}
      mail__transport: ${GHOST_MAIL_TRANSPORT}
      mail__options__host: ${GHOST_MAIL_HOST}
      mail__options__port: ${GHOST_MAIL_PORT}
      mail__options__auth__user: ${GHOST_MAIL_USER}
      mail__options__auth__pass: ${GHOST_MAIL_PASS}
      mail__from: ${GHOST_MAIL_FROM}
      NODE_ENV: production
    depends_on:
      - ghost-db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ghost.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.ghost.entrypoints=websecure"
      - "traefik.http.routers.ghost.tls.certresolver=letsencrypt"
      - "traefik.http.services.ghost.loadbalancer.server.port=2368"

  ghost-db:
    image: mysql:8.0
    <<: *restart
    volumes:
      - ./docker/ghost/ghost-db:/var/lib/mysql
    networks:
      - flora-internal
    environment:
      <<: *common-env
      MYSQL_ROOT_PASSWORD: ${GHOST_DB_PASSWORD}root
      MYSQL_DATABASE: ${GHOST_DB_NAME}
      MYSQL_USER: ${GHOST_DB_USER}
      MYSQL_PASSWORD: ${GHOST_DB_PASSWORD}

  # ===========================================================================
  # PROMETHEUS — Metrics Collection
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    <<: *restart
    volumes:
      - prometheus_data:/prometheus
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - flora-internal
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

  # ===========================================================================
  # GRAFANA — Dashboards + Monitoring
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    <<: *restart
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - flora-net
      - flora-internal
    environment:
      <<: *common-env
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: grafana.${DOMAIN}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # ===========================================================================
  # WATCHTOWER — Auto-update containers
  # ===========================================================================
  watchtower:
    image: containrrr/watchtower:latest
    <<: *restart
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - flora-internal
    environment:
      <<: *common-env
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_SCHEDULE: "0 0 4 * * *"
      WATCHTOWER_NOTIFICATIONS: email
      WATCHTOWER_NOTIFICATION_EMAIL_TO: ${WATCHTOWER_NOTIFICATION_EMAIL}
      WATCHTOWER_POLL_INTERVAL: 86400
    command: --interval 86400 --cleanup

  # ===========================================================================
  # FLORA ADMIN — Custom Dashboard
  # ===========================================================================
  flora-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    <<: *restart
    networks:
      - flora-net
      - flora-internal
    environment:
      <<: *common-env
      NODE_ENV: production
      PORT: 3001
      ADMIN_SECRET: ${ADMIN_SECRET}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flora-admin.rule=Host(`admin.${DOMAIN}`)"
      - "traefik.http.routers.flora-admin.entrypoints=websecure"
      - "traefik.http.routers.flora-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.flora-admin.loadbalancer.server.port=3001"
      - "traefik.http.routers.flora-admin.middlewares=auth@file"

global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers: []

scrape_configs:
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  - job_name: 'n8n'
    static_configs:
      - targets: ['n8n:5678']
    metrics_path: '/metrics'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'flora-admin'
    static_configs:
      - targets: ['flora-admin:3001']
    metrics_path: '/metrics'
